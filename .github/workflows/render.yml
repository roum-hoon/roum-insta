name: render
on:
  push:
    branches: [main]
    paths:
      - "content/queue/**/post.json"
      - "templates/**"
      - "scripts/render.py"
      - ".github/workflows/render.yml"
  workflow_dispatch:
concurrency:
  group: roum-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Korean fonts
        run: |
          mkdir -p ~/.fonts
          curl -fsSL -o ~/.fonts/BlackHanSans-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/blackhansans/BlackHanSans-Regular.ttf
          curl -fsSL -o ~/.fonts/NotoSansKR.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf"
          fc-cache -f
      - name: Install deps
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Render pending
        run: |
          # 템플릿이 바뀌었으면 승인 전 게시물 전부 다시 렌더
          python scripts/render.py --pending
      - name: Commit images
        run: bash .github/workflows/_commit.sh "bot - render cards"
